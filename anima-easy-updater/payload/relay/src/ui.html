<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anima 工作站</title>
<style>
  :root{--bg:#0b0d12;--panel:#141821;--panel2:#1b2130;--line:#242c3d;--text:#e6e9f0;--muted:#8b93a7;--ok:#3ddc97;--warn:#f5a524;--bad:#ff5d5d;--accent:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,"Noto Sans TC",sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  header h1{font-size:18px;margin:0;font-weight:600}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select,button{font:inherit;color:var(--text)}
  input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  textarea{resize:vertical;min-height:74px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 14px}
  button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent}
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .stat:last-child{border-bottom:0}
  .stat span:first-child{color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
  .dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
  .jobs{display:flex;flex-direction:column;gap:10px}
  .job{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
  .job .top{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#26304a;color:#c9d4ef}
  .chip.SUCCEEDED{background:#123d2c;color:#7ef0b6}.chip.FAILED{background:#3d1616;color:#ff9d9d}
  .chip.RUNNING{background:#2b2f16;color:#f5d76e}.chip.PENDING{background:#1d2a45;color:#9db8ff}
  .bar{height:6px;background:#0e1220;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#3ddc97);width:0}
  .meta{color:var(--muted);font-size:12px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .err{color:#ff9d9d}
  img.out{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
  .toast{position:fixed;right:18px;bottom:18px;max-width:380px;background:#2a1a1a;border:1px solid #5a2a2a;color:#ffd7d7;padding:10px 14px;border-radius:10px;display:none}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Anima 工作站</h1>
    <span class="badge" id="build">v2</span>
    <span class="badge" id="conn">未連線</span>
    <span style="flex:1"></span>
    <button class="ghost" id="settingsBtn">設定</button>
  </header>

  <section class="card hidden" id="loginCard" style="margin-bottom:16px">
    <h2>連線</h2>
    <label>Relay 網址</label>
    <input id="url" type="text" placeholder="https://anima.xxx.workers.dev" readonly>
    <label>Client Key（存在此瀏覽器，不會上傳到別處）</label>
    <input id="key" type="password" placeholder="貼上 client.key 內容">
    <div class="hint">網址會自動帶入目前網域；金鑰只存在這台裝置的 localStorage，可按「清除」移除。</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="primary" id="save">儲存並連線</button>
      <button id="clear">清除</button>
    </div>
  </section>

  <div class="grid">
    <div>
      <section class="card">
        <h2>系統狀態</h2>
        <div class="stat"><span>Relay</span><span id="s-relay">—</span></div>
        <div class="stat"><span>VM 代理</span><span id="s-agent">—</span></div>
        <div class="stat"><span>執行後端</span><span id="s-backend">—</span></div>
        <div class="stat"><span>模型</span><span id="s-model">—</span></div>
        <div class="stat"><span>佇列</span><span id="s-queue">—</span></div>
        <div class="stat"><span>CPU / 記憶體</span><span id="s-res">—</span></div>
        <div class="stat"><span>最近錯誤</span><span id="s-err" class="err">—</span></div>
        <div class="hint" id="s-policy"></div>
      </section>

      <section class="card" style="margin-top:16px">
        <h2>產生圖片</h2>
        <label>提示詞</label>
        <select id="recent" style="margin-bottom:6px"><option value="">最近用過的提示詞…</option></select>
        <textarea id="prompt" placeholder="描述你想要的畫面…"></textarea>
        <label>負面提示詞</label>
        <input id="neg" type="text" value="low quality, blurry">
        <div class="row">
          <div>
            <label>尺寸</label>
            <select id="size">
              <option value="512" selected>512 × 512（1:1）</option>
              <option value="768">768 × 768（1:1）</option>
              <option value="1024">1024 × 1024（1:1）</option>
              <option value="1024x576">1024 × 576（16:9）</option>
              <option value="768x432">768 × 432（16:9）</option>
              <option value="custom">自訂</option>
            </select>
          </div>
          <div>
            <label>步數</label>
            <input id="steps" type="number" min="1" max="20" value="8">
          </div>
        </div>
        <div class="row hidden" id="customRow">
          <div><label>寬</label><input id="w" type="number" value="512" step="32" min="128" max="1024"></div>
          <div><label>高</label><input id="h" type="number" value="512" step="32" min="128" max="1024"></div>
        </div>
        <div class="row">
          <div><label>種子</label><input id="seed" type="number" value="42" min="0"></div>
          <div><label>張數</label><input id="batch" type="number" min="1" max="4" value="1"></div>
          <div style="display:flex;align-items:flex-end"><button id="rand" style="width:100%">隨機</button></div>
        </div>
        <div style="margin-top:14px"><button class="primary" id="go" style="width:100%">送出</button></div>
        <div class="hint" id="formHint">寬高必須是 32 的倍數，128–1024。</div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2>任務</h2>
        <div class="jobs" id="jobs"><div class="meta">尚無任務。送出後會顯示在這裡。</div></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const LS = { url:"anima.url", key:"anima.key", jobs:"anima.jobs" };
let cfg = { url: localStorage.getItem(LS.url) || (location.protocol==="https:"?location.origin:""), key: localStorage.getItem(LS.key) || "" };
let jobs = JSON.parse(localStorage.getItem(LS.jobs) || "[]");
let timer = null;

// ---- 本機圖片快取（伺服器只保留 24h，DO 換實例也會清空）----
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("anima",1);r.onupgradeneeded=()=>r.result.createObjectStore("images");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("images","readonly").objectStore("images").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}catch(e){return null;}}
async function idbPut(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("images","readwrite");t.objectStore("images").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function idbDel(k){try{const db=await idb();await new Promise((res)=>{const t=db.transaction("images","readwrite");t.objectStore("images").delete(k);t.oncomplete=res;});}catch(e){}}

function toast(msg, ms=6000){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(()=> t.style.display="none", ms);
}
function apiBase(){ return cfg.url.replace(/\/+$/,""); }
async function api(path, opts={}){
  if(!cfg.key) throw new Error("尚未設定金鑰");
  const res = await fetch(apiBase()+path, { ...opts, headers:{ "Authorization":"Bearer "+cfg.key, "Content-Type":"application/json", ...(opts.headers||{}) } });
  if(!res.ok){
    let msg = "";
    try { const j = await res.json(); msg = j.error || ""; } catch(e){}
    const map = { 401:"金鑰不正確", 403:"沒有權限", 404:"找不到任務", 409:"任務狀態衝突", 413:"內容太大", 422:"參數不合法", 429:"佇列已滿或達到每日上限", 503:"VM 代理離線，請稍後再試" };
    throw new Error(map[res.status] || (msg || ("HTTP "+res.status)));
  }
  return res;
}

function setConn(state, text){ const el=$("conn"); el.textContent=text; el.style.color = state==="ok"?"var(--ok)":state==="warn"?"var(--warn)":state==="bad"?"var(--bad)":"var(--muted)"; }

async function refresh(){
  if(!cfg.url || !cfg.key){ $("loginCard").classList.remove("hidden"); setConn("idle","未連線"); return; }
  try{
    const h = await (await api("/healthz")).json();
    setConn("ok","已連線");
    $("s-relay").innerHTML = '<span class="dot ok"></span>READY';
    const age = h.agent_age_seconds;
    const online = h.agent_recent;
    $("s-agent").innerHTML = online
      ? `<span class="dot ${age!=null && age>90?"warn":"ok"}"></span>在線${age!=null?`（${age}s 前）`:""}`
      : '<span class="dot bad"></span>離線';
    $("s-backend").innerHTML = online
      ? '<span class="dot ok"></span>VM（Codex 雲端）'
      : (h.fallback_configured
        ? '<span class="dot warn"></span>PC fallback（本機 ComfyUI 出圖）'
        : '<span class="dot bad"></span>無後端（任務將失敗）');
    const m = h.agent?.system?.model;
    $("s-model").textContent = m ? `${m.state}${m.lora_name?" · "+m.lora_name:""}` : "—";
    $("s-queue").textContent = `待處理 ${h.pending ?? 0} / 執行中 ${h.running ?? 0}`;
    $("s-policy").dataset.fallback = h.fallback_configured ? "1" : "0";
    const cpu = h.agent?.system?.cpu, mem = h.agent?.system?.memory;
    $("s-res").textContent = cpu ? `${cpu.quota_usage_percent ?? "?"}% · ${(mem.used_bytes/1e9).toFixed(1)}/${(mem.limit_bytes/1e9).toFixed(0)} GB` : "—";
    $("s-err").textContent = h.last_error || "—";
    if(h.policy) $("s-policy").textContent = `代理逾時 ${h.policy.soft_queue_seconds}s 排隊 / ${h.policy.hard_reject_seconds}s 拒絕 · 租約 ${h.policy.lease_seconds/60} 分`;
  }catch(e){
    setConn("bad", "連線失敗");
    toast(e.message);
  }
  await refreshJobs();
}

function fmt(ts){ return ts ? new Date(ts).toLocaleTimeString() : "—"; }

function renderJob(j){
  const p = j.request || {};
  const prog = j.progress;
  const pct = prog && prog.total ? Math.round(100*prog.step/prog.total) : (j.status==="SUCCEEDED"?100:0);
  const stageMap = { ENCODING:"編碼提示詞", DENOISING:"去噪", DECODING:"解碼", SAVING:"存檔" };
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `
    <div class="top">
      <div><span class="chip ${j.status}">${({PENDING:"排隊中",RUNNING:"執行中",SUCCEEDED:"完成",FAILED:"失敗"})[j.status]||j.status}</span>${j.backend==="fallback"?'<span class="chip">備援</span>':""}
      <span class="meta">${p.width}×${p.height} · ${p.steps} 步 · seed ${p.seed}</span></div>
      <span class="meta">${fmt(j.created)}</span>
    </div>
    <div class="meta">${(p.prompt||"").slice(0,180)}</div>
    ${j.metadata?`<div class="meta">${[j.metadata.engine,j.metadata.model,j.metadata.duration_seconds?j.metadata.duration_seconds+"s":""].filter(Boolean).join(" · ")}</div>`:""}
    ${j.status==="RUNNING"&&prog?`<div class="bar"><i style="width:${pct}%"></i></div><div class="meta">${stageMap[prog.stage]||prog.stage} ${prog.step}/${prog.total} · ${prog.elapsed_seconds?.toFixed(1)}s</div>`:""}
    ${j.error?`<div class="meta err">${j.error}</div>`:""}
    ${j.status==="PENDING"?'<button class="ghost" data-cancel="'+j.id+'" style="padding:2px 10px;margin-top:8px">取消</button>':""}
  `;
  const cancelBtn = el.querySelector("[data-cancel]");
  if(cancelBtn) cancelBtn.onclick = async () => {
    cancelBtn.disabled = true;
    try { await api("/v1/jobs/"+j.id, { method:"DELETE" }); await refreshJobs(); }
    catch(e){ toast(e.message); cancelBtn.disabled = false; }
  };
  if(j.status==="SUCCEEDED"){
    const img = document.createElement("img");
    img.className="out"; img.alt="生成結果";
    el.appendChild(img);
    const dl = document.createElement("a");
    dl.textContent = "下載 PNG"; dl.className = "chip"; dl.style.cssText = "display:inline-block;margin-top:8px;text-decoration:none";
    dl.download = j.id + ".png";
    img.after(dl);
    if(j._imgUrl){ img.src = j._imgUrl; dl.href = j._imgUrl; }
    else {
      idbGet(j.id).then(cached=>{
        if(cached){ j._imgUrl = URL.createObjectURL(cached); img.src = j._imgUrl; dl.href = j._imgUrl; return; }
        api(`/v1/jobs/${j.id}/image`).then(r=>r.blob()).then(b=>{
          idbPut(j.id,b);
          j._imgUrl = URL.createObjectURL(b); img.src = j._imgUrl; dl.href = j._imgUrl;
        }).catch(()=>{ img.remove(); });
      });
    }
  }
  return el;
}

function renderExpired(id, blob){
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `<div class="top"><div><span class="chip">已過期</span>
    <span class="meta">伺服器紀錄已清除（保留 24 小時）</span></div>
    <button class="ghost" data-del="${id}" style="padding:2px 10px">刪除</button></div>`;
  if(blob){ const img=document.createElement("img"); img.className="out"; img.src=URL.createObjectURL(blob); el.appendChild(img); }
  else { const p=document.createElement("div"); p.className="meta"; p.textContent="本機也沒有快取"; el.appendChild(p); }
  el.querySelector("[data-del]").onclick = async () => { await idbDel(id); jobs = jobs.filter(x=>x!==id); localStorage.setItem(LS.jobs, JSON.stringify(jobs)); refreshJobs(); };
  return el;
}

async function refreshJobs(force){
  const box = $("jobs");
  let server = null;
  try { server = (await (await api("/v1/jobs?limit=20")).json()).jobs; } catch(e) { server = null; }

  if(server){
    const ids = server.map(j => j.id);
    const sig = JSON.stringify(server.map(j => [j.id, j.status]));
    if(!force && (window.scrollY > 40 || box.matches(":hover"))) return;
    jobs = [...ids, ...jobs.filter(id => !ids.includes(id))].slice(0, 40);
    localStorage.setItem(LS.jobs, JSON.stringify(jobs));
    box.innerHTML = "";
    if(!server.length) box.innerHTML = '<div class="meta">尚無任務。送出後會顯示在這裡。</div>';
    for(const j of server) box.appendChild(renderJob(j));
    const localOnly = jobs.filter(id => !ids.includes(id)).slice(0, 12);
    for(const id of localOnly){ const blob = await idbGet(id); box.appendChild(renderExpired(id, blob)); }
    return;
  }

  if(!jobs.length){ box.innerHTML = '<div class="meta">尚無任務。送出後會顯示在這裡。</div>'; return; }
  const before = jobs.slice(0,12);
  box.innerHTML = "";
  const stillThere = [];
  for(const id of before){
    let j = null;
    try { j = await (await api("/v1/jobs/"+id)).json(); }
    catch(e){
      const blob = await idbGet(id);
      box.appendChild(renderExpired(id, blob));
      stillThere.push(id);
      continue;
    }
    stillThere.push(id);
    box.appendChild(renderJob(j));
  }
  jobs = [...stillThere, ...jobs.slice(12)];
  localStorage.setItem(LS.jobs, JSON.stringify(jobs));
}

async function submit(){
  const prompt = $("prompt").value.trim();
  if(!prompt){ toast("請先輸入提示詞"); return; }
  let w,$h;
  const sizeSel = $("size").value;
  let width, height;
  if(sizeSel==="custom"){ width=+$("w").value; height=+$("h").value; }
  else if(sizeSel.includes("x")){ const [a,b]=sizeSel.split("x"); width=+a; height=+b; }
  else { width=height=+sizeSel; }
  for(const v of [width,height]) if(v<128||v>1024||v%32){ toast("寬高必須是 128–1024 且為 32 的倍數"); return; }
  const steps = +$("steps").value;
  const batch = Math.max(1, Math.min(4, +$("batch").value || 1));
  const baseSeed = +$("seed").value;
  $("go").disabled = true;
  let queued = 0, offline = false;
  try{
    for(let i=0;i<batch;i++){
      const body = { prompt, negative_prompt: $("neg").value, width, height, steps, seed: baseSeed + i };
      const r = await api("/v1/generations", { method:"POST", body: JSON.stringify(body) });
      const j = await r.json();
      jobs.unshift(j.id); localStorage.setItem(LS.jobs, JSON.stringify(jobs));
      queued++;
      if(j.queued_while_agent_offline) offline = true;
      await refreshJobs();
    }
    rememberPrompt(prompt);
    if(queued>1) toast(`已送出 ${queued} 張（seed ${baseSeed}–${baseSeed+queued-1}）`, 5000);
    if(offline) toast("VM 代理目前離線，任務已排隊（10 分鐘內未執行會自動失敗）", 8000);
    refresh();
  }catch(e){ toast(e.message, 8000); }
  finally{ $("go").disabled = false; }
}

const LS_PROMPTS = "anima.prompts";
function loadPrompts(){ try{ return JSON.parse(localStorage.getItem(LS_PROMPTS)||"[]"); }catch(e){ return []; } }
function rememberPrompt(p){
  const list = loadPrompts().filter(x=>x!==p); list.unshift(p);
  localStorage.setItem(LS_PROMPTS, JSON.stringify(list.slice(0,20)));
  renderRecent();
}
function renderRecent(){
  const sel = $("recent"); const list = loadPrompts();
  sel.innerHTML = '<option value="">最近用過的提示詞…</option>' + list.map((p,i)=>`<option value="${i}">${p.slice(0,60).replace(/</g,"&lt;")}</option>`).join("");
  sel.onchange = () => { const i = sel.value; if(i!==""){ $("prompt").value = loadPrompts()[+i]; sel.value=""; } };
}

function applyCfg(){
  $("url").value = cfg.url; $("key").value = cfg.key;
  $("loginCard").classList.toggle("hidden", !!(cfg.url && cfg.key));
}
$("save").onclick = () => {
  const url = $("url").value.trim(); const key = $("key").value.trim();
  if(!/^https:\/\//.test(url)){ toast("網址必須是 https://"); return; }
  if(key.length < 32){ toast("金鑰長度不正確"); return; }
  cfg = { url, key }; localStorage.setItem(LS.url,url); localStorage.setItem(LS.key,key);
  $("loginCard").classList.add("hidden"); refresh();
};
$("clear").onclick = () => { localStorage.removeItem(LS.url); localStorage.removeItem(LS.key); cfg={url:"",key:""}; applyCfg(); setConn("idle","未連線"); };
$("settingsBtn").onclick = () => $("loginCard").classList.toggle("hidden");
$("size").onchange = e => $("customRow").classList.toggle("hidden", e.target.value!=="custom");
$("rand").onclick = () => $("seed").value = Math.floor(Math.random()*4294967295);
$("go").onclick = submit;

// 支援 #key=<client key> 一次性帶入（掃 QR 用），帶入後立刻從網址移除
(function adoptHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return;
  const params = new URLSearchParams(h);
  const k = params.get("key");
  if(k && k.length>=32){
    cfg.key = k;
    cfg.url = params.get("url") || cfg.url;
    localStorage.setItem(LS.key, cfg.key);
    localStorage.setItem(LS.url, cfg.url);
    history.replaceState(null, "", location.pathname);
  }
})();

applyCfg();
renderRecent();
refresh();
timer = setInterval(()=>{ if(cfg.key && !document.hidden) refresh(); }, 4000);
setInterval(()=>{ if(cfg.key && !document.hidden && (window.scrollY <= 40) && !document.querySelector(".bar")) refreshJobs(true); }, 4000);
</script>
</body>
</html>
