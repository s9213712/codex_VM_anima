<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anima 本機送單台</title>
<style>body{font:16px system-ui;background:#101827;color:#e5edf8;max-width:980px;margin:30px auto;padding:18px}textarea,input,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #475569;background:#1e293b;color:#f1f5f9}textarea{width:95%;min-height:100px}button{background:#34d399;color:#0f172a;cursor:pointer;border:0}button:disabled{opacity:.4;cursor:default}section{background:#172235;padding:20px;border-radius:14px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#243348;padding:15px;border-radius:8px}.small{color:#a7b8d0;font-size:14px}label{display:inline-block;margin:8px 12px 8px 0}#error{color:#fda4af;white-space:pre-wrap}img{max-width:100%;border-radius:10px}a{color:#6ee7b7}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Anima 本機送單台</h1><p id="connection" class="small">正在讀取連線設定…</p><p id="error"></p>
<section><h2>VM 概況</h2><div class="cards"><div class="card">狀態<strong id="online" style="display:block">讀取中</strong></div><div class="card">CPU<strong id="cpu" style="display:block">—</strong></div><div class="card">記憶體<strong id="ram" style="display:block">—</strong></div><div class="card">磁碟剩餘<strong id="disk" style="display:block">—</strong></div></div><p id="snapshot" class="small">資料為 VM 主動上送的快照；沒有新快照時會顯示離線。</p><button id="refresh">更新資源</button> <button id="startCloud" disabled>啟動雲端工作</button><p id="cloudInfo" class="small">未設定雲端任務派發。這個按鈕不是 VM 電源管理介面。</p></section>
<section><h2>建立圖片任務</h2><label style="display:block">提示詞</label><textarea id="prompt" placeholder="例如：日出時湖邊的小木屋，動畫背景風格"></textarea><details><summary>負面提示詞</summary><textarea id="negative">low quality, blurry</textarea></details><div><label>尺寸 <select id="size"><option>128</option><option selected>256</option><option>384</option><option>512</option></select></label><label>步數 <select id="steps"><option>4</option><option selected>8</option><option>12</option><option>16</option><option>20</option></select></label><label>Seed <input id="seed" type="number" min="0" max="4294967295" value="42" style="width:120px"></label></div><label><input id="auto" type="checkbox" checked> 完成後自動下載</label><button id="submit">送出任務</button><p class="small">模型在 VM 執行，本機不需要模型。VM 暫停時任務會等待；關閉本機視窗後可用任務編號稍後取圖。</p></section>
<section><h2>任務與結果</h2><label>任務編號 <input id="job" style="width:240px"></label><button id="lookup">查詢／取圖</button><pre id="jobStatus">尚未送單</pre><a id="download" hidden>下載 PNG</a><div><img id="image" hidden></div></section>
<script>
const nonce='__LOCAL_NONCE__';let active='',busy=false,lastDownloaded='',blobUrl=null;const $=s=>document.querySelector(s);const err=e=>{$('#error').textContent=e.message||String(e)};const gib=x=>typeof x==='number'?(x/1073741824).toFixed(1)+' GiB':'—';
async function api(path,body,binary=false){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Local-Session':nonce,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let d;try{d=await r.json()}catch{d={error:r.statusText}}throw Error(d.error||r.status)}return binary?r.blob():r.json()}
async function resources(){try{const r=await api('resources');const s=r.system||r;const age=r.snapshot_age_seconds;const online=r.online??(s.model?.state==='READY');$('#online').textContent=online?'VM 有近期快照':'VM 離線／無近期快照';$('#cpu').textContent=s.cpu?(s.cpu.quota_usage_percent==null?'取樣中':s.cpu.quota_usage_percent.toFixed(1)+'%')+' / '+(s.cpu.quota_cores??s.cpu.visible_cores)+' 核':'—';$('#ram').textContent=s.memory?gib(s.memory.used_bytes)+' / '+gib(s.memory.limit_bytes):'—';$('#disk').textContent=s.disk?gib(s.disk.free_bytes):'—';$('#snapshot').textContent='模型：'+(s.model?.state||'未知')+'；快照時間：'+(r.observed_at?new Date(r.observed_at*1000).toLocaleString():'尚無')+(typeof age==='number'?'，約 '+Math.round(age)+' 秒前':'');}catch(e){$('#online').textContent='尚未連線';err(e)}}
async function poll(){if(!active||busy)return;busy=true;try{const r=await api('jobs/'+encodeURIComponent(active));$('#jobStatus').textContent=JSON.stringify({id:r.id,status:r.status,error:r.error,metadata:r.metadata,result_url:r.result_url},null,2);if(r.status==='SUCCEEDED'&&lastDownloaded!==active){const id=active;const blob=await api('jobs/'+encodeURIComponent(id)+'/image',null,true);if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(blob);$('#image').src=blobUrl;$('#image').hidden=false;const a=$('#download');a.href=blobUrl;a.download='anima-'+id+'.png';a.hidden=false;lastDownloaded=id;if($('#auto').checked)a.click();}if(['FAILED','BLOCKED','SUCCEEDED'].includes(r.status))active='';}catch(e){err(e)}finally{busy=false}}
$('#submit').onclick=async()=>{try{$('#error').textContent='';$('#submit').disabled=true;const r=await api('submit',{prompt:$('#prompt').value,negative_prompt:$('#negative').value,size:Number($('#size').value),steps:Number($('#steps').value),seed:Number($('#seed').value)});active=r.id;$('#job').value=r.id;localStorage.setItem('anima-last-job',r.id);$('#jobStatus').textContent=JSON.stringify(r,null,2);await poll();}catch(e){err(e)}finally{$('#submit').disabled=false}};
$('#lookup').onclick=()=>{active=$('#job').value.trim();poll()};$('#refresh').onclick=resources;
$('#startCloud').onclick=async()=>{if(!confirm('提交一個新的 Codex Cloud 工作，會使用你的原生額度；不保證喚醒同一台 VM。是否繼續？'))return;try{$('#startCloud').disabled=true;const r=await api('cloud-task',{});$('#cloudInfo').textContent=r.output+'\n'+r.note}catch(e){err(e)}finally{$('#startCloud').disabled=false}};
(async()=>{try{const c=await api('config');$('#connection').textContent=c.backend==='github'?'私人任務匣：'+c.repo:'已配置 API 連線';$('#startCloud').disabled=!c.cloud_start_configured;$('#cloudInfo').textContent=c.cloud_start_configured?'可提交雲端工作；仍需本機 Codex CLI 授權。':'VM 由平台管理；未設定可用的雲端任務環境 ID。';}catch(e){err(e)}$('#job').value=localStorage.getItem('anima-last-job')||'';await resources()})();setInterval(poll,10000);setInterval(resources,30000);
</script></html>
